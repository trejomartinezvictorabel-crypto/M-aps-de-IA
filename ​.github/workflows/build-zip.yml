name: Compilar APK desde ZIP Automático

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'  # Se dispara automáticamente SOLO cuando subes o actualizas un archivo ZIP
  workflow_dispatch:

jobs:
  build-from-zip:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. Buscar, descomprobar y combinar archivos ZIP
        run: |
          echo "Buscando archivos .zip en el repositorio..."
          # Busca cualquier archivo zip en la raíz y lo descomprime reemplazando o combinando
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Descomprimiendo y combinando: $file"
              unzip -o "$file" -d .
            fi
          done
          
          # Verificar si se extrajo un gradlew, si no, crear el wrapper de gradle
          if [ ! -f "gradlew" ]; then
            echo "Generando Gradle Wrapper automáticamente..."
            gradle wrapper
          fi

      - name: 5. Aceptar licencias de Android y compilar APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Guardar la APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-multimodal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
